# Example configuration for isometric sprite renderer
# This demonstrates all available settings with sensible defaults

render:
  size: [50, 50]          # Output sprite size in pixels [width, height]
  directions: 8           # Number of rotation angles (8 = N, NE, E, SE, S, SW, W, NW)
  ortho_scale: 2.0        # Orthographic camera scale (lower = more zoomed in, higher = more zoomed out)
  rotate_x: 1             # Rotate 90° around X axis (0=0°, 1=90°, 2=180°, 3=270°)
  rotate_y: 0             # Rotate around Y axis
  rotate_z: 0             # Rotate around Z axis

lighting:
  sun_direction: [1, -1, 1]      # Sun light direction vector [X, Y, Z]
  sun_color: [1.0, 1.0, 1.0]     # Sun light color [R, G, B] (0-1 range, white)
  sun_energy: 3.0                # Sun light intensity
  ambient_color: [0.3, 0.3, 0.3] # Ambient light color [R, G, B] (subtle gray)
  ambient_energy: 0.5            # Ambient light intensity

camera:
  elevation_angle: 35.264  # Camera elevation angle in degrees (35.264 = true isometric)
  rotation_offset: 45      # Starting rotation angle in degrees

output:
  directory: "./sprites"   # Output directory for rendered sprites
  individual_pngs: true    # Save individual PNG files per rotation
  sprite_sheet: true       # Generate combined sprite sheet
  transparent_bg: true     # Use transparent background (alpha channel)

# Example usage with this config:
#   iso_render --input teapot.obj --config render.yaml
#   iso_render --batch models/ --config render.yaml
#   iso_render --input teapot.obj --config render.yaml --size 128  # Override size

